name: Publicar en GitHub Pages

# Compila el sitio estático y lo sube a la rama gh-pages, de donde publica GitHub Pages.
# (El deploy por Actions, actions/deploy-pages, se colgaba en "updating_pages" en este repo.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Una publicación nueva espera a que termine la anterior; nunca se corta a la mitad.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /billetera-hogar
          # Variables del repo (Settings → Secrets and variables → Actions → Variables).
          # Si no están, el sitio publica el modo demo.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Subir a gh-pages
        run: |
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
