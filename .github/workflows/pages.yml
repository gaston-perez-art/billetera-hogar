name: Publicar en GitHub Pages

on:
  push:
    branches: [main, poc-local]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No cortar una publicación a la mitad: si se cancela mientras Pages actualiza, la
# publicación queda colgada y las siguientes del mismo commit se rechazan. Como en la
# plantilla oficial de GitHub, la nueva espera a que termine la anterior.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /billetera-hogar
          # Variables del repo (Settings → Secrets and variables → Actions → Variables).
          # Si no están, el sitio publica el modo demo.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
